
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Playlist | Atmosphere</title>
    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="results.css">
</head>
<body>
    <main class="results-page">
        <header class="results-nav">
            <a href="index.html">← Back to builder</a>
            <span>ATMOSPHERE</span>
        </header>

        <section class="results-content">
            <p class="eyebrow" id="location-label"></p>
            <h1>Your seasonal soundtrack.</h1>
            <p id="playlist-description"></p>

            <div class="playlist-details">
                <span id="algorithm-label"></span>
                <span id="song-total"></span>
            </div>

            <div class="playlist-table">
                <div class="table-heading">
                    <span>#</span>
                    <span>Song</span>
                    <span>Match</span>
                </div>
                <div id="playlist-results"></div>
            </div>

            <p class="demo-note">
                Preview recommendations — sample data until
                the C++ recommendation engine is connected.
            </p>
        </section>
    </main>

    <script src="results.js"></script>
</body>
</html>
